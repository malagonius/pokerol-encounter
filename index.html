<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokerole Encounter Helper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="layout">
    <!-- Static toggle button — always visible, stays in place on mobile -->
    <button type="button" id="filterToggle" class="filter-toggle">
      <span class="filter-toggle-icon">▼</span> Filters
    </button>

    <!-- Modal overlay for mobile filter drawer -->
    <div class="filter-overlay" id="filterOverlay">
      <div class="modal-content">
        <section class="panel controls" id="controlsPanel">
        <div class="controls-header">
          <h1>Encounter Helper</h1>
        </div>
        <p class="subtitle">Pokemon encounter generator with extra filters (including Type).</p>

      <div class="field-grid">
        <label>
          Number to generate
          <input id="count" type="number" min="1" max="12" value="1">
        </label>

        <label>
          Pokemon name contains
          <input id="nameFilter" type="text" placeholder="pik, char, bul...">
        </label>

        <fieldset class="multi-fieldset" id="typeGroup">
          <legend>Type (OR)</legend>
          <div id="typeOptions" class="option-grid"></div>
        </fieldset>

        <fieldset class="multi-fieldset" id="generationGroup">
          <legend>Generation</legend>
          <div id="generationOptions" class="option-grid"></div>
        </fieldset>

        <fieldset class="multi-fieldset" id="habitatGroup">
          <legend>Habitat</legend>
          <div id="habitatOptions" class="option-grid"></div>
        </fieldset>

        <label>
          Include legendary
          <select id="legendaryFilter">
            <option value="no_legendaries">No legendaries</option>
            <option value="include_legendaries">Include legendaries</option>
            <option value="only_legendaries">Only legendaries</option>
          </select>
        </label>

        <fieldset class="multi-fieldset" id="rankMethodGroup">
          <legend>Rank methods</legend>
          <div id="rankMethodOptions" class="option-grid"></div>
        </fieldset>

        <label class="check-row">
          <input id="rankOrLower" type="checkbox" checked>
          Recommended rank or lower
        </label>

        <label class="check-row">
          <input id="includeMythical" type="checkbox">
          Include mythical
        </label>

        <label class="check-row">
          <input id="excludeForms" type="checkbox" checked>
          Exclude form variants (name with "-")
        </label>
      </div>

      <div class="actions">
        <button id="generateBtn" type="button">Generate encounter</button>
        <button id="copyBtn" type="button" class="ghost">Copy result</button>
        <button id="resetBtn" type="button" class="ghost">Reset filters</button>
      </div>

      <p id="status" class="status">Loading base Pokemon list...</p>
      </section>
    </div>
    <!-- End modal content -->
    </div>
    <!-- End filter overlay -->

    <section class="panel results">
      <header class="results-head">
        <h2>Generated Encounter</h2>
        <p id="resultMeta" class="result-meta"></p>
      </header>
      <div id="results" class="results-grid"></div>
    </section>
  </main>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-actions">
        <button class="chevron-btn" type="button" title="Show details">▼</button>
        <button class="lock-btn" type="button" title="Lock this Pokémon">🔒</button>
        <button class="remove-btn" type="button" title="Remove this Pokémon">✕</button>
      </div>
      <div class="card-top">
        <img class="sprite" alt="">
        <div>
          <h3 class="name"></h3>
          <p class="meta"></p>
          <p class="meta extra"></p>
        </div>
      </div>
      <div class="chips"></div>
      <button class="shiny-btn" type="button">Roll Shiny</button>
      <div class="detail-panel" style="display: none;">
        <div class="stats-grid" style="display: none;"></div>
        <div class="hp-row" style="display: none;">
          <span class="hp-label">HP:</span>
          <button class="hp-dec" type="button">−</button>
          <span class="hp-value"></span>
          <button class="hp-inc" type="button">+</button>
        </div>
        <div class="moves" style="display: none;"></div>
      </div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
